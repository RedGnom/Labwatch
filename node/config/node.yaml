# Идентификация узла
node:
  id: "node-01"
  name: "Домашняя лаборатория"
  location: "Полка в шкафу"

# Источник данных: simulated | real
sensor_source: simulated

# Параметры симулятора (используются только если sensor_source: simulated)
simulation:
  interval_seconds: 5        # как часто "снимаем" показания
  seed: 42                   # для воспроизводимости

# Пороги и сценарии
thresholds:
  cpu_temp_c:
    warn: 70
    critical: 85
  case_temp_c:
    warn: 45
    critical: 60
  humidity_pct:
    warn: 70
    critical: 85
  current_a:
    warn: 3.0
    critical: 5.0
  voltage_v:
    min: 11.5
    max: 12.8
  fan_rpm:
    max: 3000

# Поведение при инцидентах
actions:
  fan_on_at_cpu_temp_c: 75  # включить вентилятор
  fan_off_at_cpu_temp_c: 60  # выключить вентилятор
  watchdog:
    enabled: true
    check_interval_seconds: 10
    restart_after_failures: 3

# Сервер ()
server:
  url: "http://localhost:8000"
  token: ""
  send_interval_seconds: 5
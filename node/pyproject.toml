[project]
name = "labwatch-node"
version = "0.1.0"
description = "LabWatch node agent: сбор телеметрии и отправка на сервер"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
labwatch-node = "node.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["node*"]